<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Mint Picnic Monad Pet</title>
  <desc id="desc">A happy, round mint pet with a peach sprout, big cream eyes, rosy cheeks, and one Monad-purple bandana.</desc>
  <ellipse cx="128" cy="238" rx="77" ry="9" fill="#E9E2FA"/>
  <g stroke="#200052" stroke-linecap="round" stroke-linejoin="round">
    <!-- The familiar sprout is part of the pet; the bandana is its one accessory. -->
    <path d="M128 55c-2-15 0-24 9-34" fill="none" stroke-width="7"/>
    <path d="M136 23c8-17 28-18 36-8-9 14-27 18-36 8Z" fill="#FFBD9E" stroke-width="6"/>
    <!-- Bandana tail, behind the body. -->
    <path d="M206 187c17 3 27 15 34 32l-17-3-7 12-19-33Z" fill="#836EF9" stroke-width="7"/>
    <path d="M128 52c65 0 99 53 99 105 0 48-40 73-99 73s-99-25-99-73c0-52 34-105 99-105Z" fill="#A8EBD6" stroke-width="8"/>
    <path d="M49 166c9 28 38 42 79 42s70-14 79-42c-4 36-32 55-79 55s-75-19-79-55Z" fill="#78CEB8" stroke="none"/>
    <path d="M64 92c11-15 27-24 44-27" fill="none" stroke="#DFFFF1" stroke-width="9"/>
    <g fill="#FFF9EF" stroke-width="6">
      <ellipse cx="94" cy="120" rx="24" ry="28"/>
      <ellipse cx="162" cy="120" rx="24" ry="28"/>
    </g>
    <g fill="#200052" stroke="none">
      <ellipse cx="98" cy="124" rx="13" ry="16"/>
      <ellipse cx="166" cy="124" rx="13" ry="16"/>
    </g>
    <g fill="#FFF9EF" stroke="none">
      <circle cx="102" cy="118" r="4"/>
      <circle cx="170" cy="118" r="4"/>
    </g>
    <g fill="#FFBD9E" stroke="none">
      <ellipse cx="65" cy="158" rx="14" ry="9"/>
      <ellipse cx="191" cy="158" rx="14" ry="9"/>
    </g>
    <path d="M110 158q18 25 36 0Z" fill="#200052" stroke-width="5"/>
    <!-- A single, broad bandana stays legible at small icon sizes. -->
    <path d="M64 184q64 24 128 0l-52 39q-12 9-24 0Z" fill="#836EF9" stroke-width="7"/>
    <path d="m115 200 13 11 13-11" fill="none" stroke="#E5DDFF" stroke-width="5"/>
    <path d="M193 183q12-6 18 5t-7 16q-13 2-15-9t4-12Z" fill="#A997FF" stroke-width="6"/>
  </g>
</svg>
