      .star {

        height: 8px;
        border-radius: 50%;

    <script>
      // ---------- deterministic decor ----------
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(8183);

      const starsEl = document.getElementById("stars");
      const stars = [];
      for (let i = 0; i < 22; i++) {
        const s = document.createElement("div");
        s.className = "star";
        s.style.left = Math.round(60 + rand() * 1800) + "px";
        s.style.top = Math.round(40 + rand() * 520) + "px";
        const size = 5 + Math.round(rand() * 6);
        s.style.width = size + "px";
        s.style.height = size + "px";
        starsEl.appendChild(s);
        stars.push(s);
      }

      const HEART =
        '<svg viewBox="0 0 44 40" width="100%" height="100%"><path d="M22 38 C10 29 2 21 2 12 C2 6 7 2 12.5 2 C16.5 2 20 4.5 22 8 C24 4.5 27.5 2 31.5 2 C37 2 42 6 42 12 C42 21 34 29 22 38 Z" fill="#ff7fa8" stroke="#1e1646" stroke-width="2.5"/></svg>';
      const SPARK =
        '<svg viewBox="0 0 40 40" width="100%" height="100%"><path d="M20 0 C22 13 27 18 40 20 C27 22 22 27 20 40 C18 27 13 22 0 20 C13 18 18 13 20 0 Z" fill="#ffe58a" stroke="#1e1646" stroke-width="1.5"/></svg>';
      const fxEl = document.getElementById("fx");
      function addFx(cls, svg, x, y) {
        const el = document.createElement("div");
        el.className = "fx " + cls;
        el.style.left = x + "px";
        el.style.top = y + "px";
        el.innerHTML = svg;
        fxEl.appendChild(el);
        return el;
      }
      // intro sparkles and two early hearts
      const introSparks = [
        [700, 380],
        [1180, 400],
        [660, 620],
        [1230, 640],
        [940, 280],
      ].map(([x, y]) => addFx("spark", SPARK, x, y));
      const introHearts = [
        [1120, 390],
        [760, 420],
      ].map(([x, y]) => addFx("heart", HEART, x, y));
      // feeding: hearts and sparkles
      const feedHearts = [
        [720, 470],
        [1150, 450],
        [640, 610],
        [1230, 600],
        [880, 330],
        [1040, 320],
      ].map(([x, y]) => addFx("heart", HEART, x, y));
      const feedSparks = [
        [600, 420],
        [1290, 420],
        [700, 280],
        [1200, 290],
        [560, 690],
        [1320, 700],
      ].map(([x, y]) => addFx("spark", SPARK, x, y));
      const CONFETTI_COLORS = ["#836ef9", "#ffb3c7", "#7ee6a8", "#ffe58a", "#9ed8ff", "#ff7fa8"];
      const confetti = [];
      for (let i = 0; i < 30; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
        fxEl.appendChild(c);
        const ang = -Math.PI * (0.08 + rand() * 0.84);
        const dist = 260 + rand() * 420;
        confetti.push({ el: c, dx: Math.cos(ang) * dist, dy: Math.sin(ang) * dist, rot: -360 + rand() * 720, fall: 220 + rand() * 260 });
      }

      // ---------- timeline ----------
      const tl = gsap.timeline({ paused: true });
      const BEAT = 0.5108;

      // Beat 1 (0 - 4.5): meet the pet
      tl.fromTo("#pet-scale", { scale: 0 }, { scale: 1, duration: 0.6, ease: "back.out(2.2)" }, 0.15);
      tl.fromTo("#pet-pos", { y: 160 }, { y: 0, duration: 0.55, ease: "power3.out" }, 0.15);
      tl.fromTo("#pet-shadow", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.25);
      tl.to("#pet-scale", { scaleX: 1.12, scaleY: 0.88, duration: 0.12, ease: "power2.out" }, 0.76);
      tl.to("#pet-scale", { scaleX: 1, scaleY: 1, duration: 0.6, ease: "elastic.out(1, 0.4)" }, 0.88);
      introSparks.forEach((el, i) => {
        tl.fromTo(el, { scale: 0, opacity: 0, rotation: -45 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.3, ease: "back.out(3)" }, 0.55 + i * 0.06);
        tl.to(el, { scale: 0, opacity: 0, duration: 0.35, ease: "power2.in" }, 1.25 + i * 0.06);
      });
      tl.fromTo("#hud-panel", { y: -200 }, { y: 0, duration: 0.6, ease: "back.out(1.6)" }, 1.0);
      tl.fromTo("#meter-fill", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power2.out" }, 1.3);
      // blinks
      [1.7, 3.55].forEach((t) => {
        tl.to(["#lid-l", "#lid-r"], { attr: { height: 132 }, duration: 0.08, ease: "power1.in" }, t);
        tl.to(["#lid-l", "#lid-r"], { attr: { height: 0 }, duration: 0.1, ease: "power1.out" }, t + 0.1);
      });
      // idle bob on the beat
      tl.to("#pet-pos", { y: -16, duration: BEAT, ease: "sine.inOut", yoyo: true, repeat: 5 }, 1.45);
      // a happy hop with hearts
      tl.to("#pet-hop", { y: -70, duration: 0.25, ease: "power2.out" }, 2.55);
      tl.to("#pet-hop", { y: 0, duration: 0.3, ease: "bounce.out" }, 2.8);
      tl.to("#antenna-ball", { y: -10, duration: 0.15, yoyo: true, repeat: 1, ease: "sine.inOut" }, 2.6);
      introHearts.forEach((el, i) => {
        tl.fromTo(el, { opacity: 0, scale: 0.4, y: 0 }, { opacity: 1, scale: 1, y: -60, duration: 0.4, ease: "back.out(2)" }, 2.6 + i * 0.12);
        tl.to(el, { opacity: 0, y: -160, duration: 0.7, ease: "power1.in" }, 3.1 + i * 0.12);
      });
      // decor drift across the whole world clip
      tl.to("#blob-a", { y: 40, x: 20, duration: 3.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      tl.to("#blob-b", { y: -36, duration: 3.1, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      tl.to("#blob-c", { y: 30, x: -20, duration: 2.9, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      tl.to("#blob-d", { y: 28, duration: 3.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);

      // Beat 2 (4.5 - 9.2): time passes, it gets hungry
      tl.to("#dusk", { opacity: 0.86, duration: 2.2, ease: "power1.inOut" }, 4.5);
      tl.to("#sun", { y: 560, opacity: 0.2, duration: 2.6, ease: "power1.in" }, 4.5);
      tl.to("#ground", { backgroundColor: "#6d5f9c", duration: 2.2, ease: "power1.inOut" }, 4.5);
      stars.forEach((s, i) => {
        tl.to(s, { opacity: 0.9, duration: 0.4, ease: "power1.out" }, 5.3 + (i % 7) * 0.18);
      });
      tl.fromTo("#blocks-panel", { opacity: 0, x: -120 }, { opacity: 1, x: 0, duration: 0.45, ease: "back.out(1.6)" }, 4.55);
      tl.set("#d0", { opacity: 1 }, 4.55);
      [
        ["#d0", "#d1", 5.0],
        ["#d1", "#d2", 6.02],
        ["#d2", "#d3", 7.04],
      ].forEach(([from, to, t], i) => {
        tl.set(from, { opacity: 0 }, t);
        tl.set(to, { opacity: 1 }, t);
        tl.fromTo(to, { scale: 1.7 }, { scale: 1, duration: 0.35, ease: "back.out(2.5)" }, t);
        tl.fromTo("#blocks-panel", { x: -14 }, { x: 0, duration: 0.4, ease: "elastic.out(1.2, 0.3)" }, t);
        tl.to("#d" + (i + 1), { color: ["#ffe58a", "#ffb36e", "#ff7a8a"][i], duration: 0.01 }, t);
      });
      // the tummy drains, step by step
      [
        [5.0, 0.7, "#c9e67e"],
        [6.02, 0.42, "#ffd66e"],
        [7.04, 0.12, "#ff7a8a"],
      ].forEach(([t, v, c]) => {
        tl.to("#meter-fill", { scaleX: v, backgroundColor: c, duration: 0.45, ease: "power2.out" }, t);
      });
      tl.to("#meter-fill", { opacity: 0.35, duration: 0.2, yoyo: true, repeat: 7, ease: "steps(1)" }, 7.5);
      tl.to("#hud-heart", { scale: 0.8, duration: 0.2, yoyo: true, repeat: 7, ease: "sine.inOut" }, 7.5);
      // the pet droops
      tl.to("#pet-pos", { y: 0, duration: 0.2 }, 4.52);
      tl.to(["#lid-l", "#lid-r"], { attr: { height: 58 }, duration: 0.5, ease: "power2.inOut" }, 5.05);
      tl.to("#pupils", { y: 10, duration: 0.5, ease: "power2.inOut" }, 5.05);
      tl.to("#m-smile", { opacity: 0, duration: 0.15 }, 5.3);
      tl.to("#m-frown", { opacity: 1, duration: 0.15 }, 5.3);
      tl.to("#cheeks", { opacity: 0.25, duration: 0.8 }, 5.3);
      tl.to("#pet-scale", { scaleX: 1.07, scaleY: 0.86, duration: 1.6, ease: "power2.inOut" }, 5.4);
      tl.fromTo("#pet-svg", { filter: "saturate(1) brightness(1)" }, { filter: "saturate(0.35) brightness(0.92)", duration: 2.2, ease: "power1.inOut" }, 5.0);
      tl.fromTo("#sweat", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.3 }, 6.2);
      tl.to("#sweat", { y: 60, opacity: 0, duration: 1.0, ease: "power1.in" }, 6.6);
      // stomach rumble
      tl.fromTo("#pet-shake", { x: -9 }, { x: 9, duration: 0.05, yoyo: true, repeat: 13, ease: "none" }, 7.4);
      tl.to("#pet-shake", { x: 0, duration: 0.05 }, 8.1);
      tl.fromTo("#grumble", { opacity: 0, scale: 0.4, rotation: -12 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.35, ease: "back.out(2.5)" }, 7.4);
      tl.to("#grumble", { opacity: 0, y: -30, duration: 0.3 }, 8.7);
      // dramatic push-in
      tl.to("#world", { scale: 1.2, duration: 1.7, ease: "power1.in" }, 7.25);
      tl.to("#vignette", { opacity: 1, duration: 1.5, ease: "power1.in" }, 7.3);

      // Beat 3 (9.0 - 13.3): feed it $CHOMP
      tl.to("#world", { scale: 1, duration: 0.4, ease: "power3.out" }, 8.95);
      tl.to("#vignette", { opacity: 0.4, duration: 0.4 }, 8.95);
      tl.set("#coin", { opacity: 0, y: -820, rotation: -30 }, 0);
      tl.to("#coin", { opacity: 1, duration: 0.01 }, 9.0);
      tl.to("#coin", { y: 0, rotation: 20, duration: 0.72, ease: "power2.in" }, 9.0);
      tl.to("#coin", { scaleX: 0.25, duration: 0.12, yoyo: true, repeat: 5, ease: "sine.inOut" }, 9.0);
      tl.to("#pupils", { y: -14, duration: 0.25, ease: "power2.out" }, 9.05);
      tl.to(["#lid-l", "#lid-r"], { attr: { height: 0 }, duration: 0.2, ease: "power2.out" }, 9.05);
      tl.to("#m-frown", { opacity: 0, duration: 0.08 }, 9.3);
      tl.fromTo("#m-open", { opacity: 0, scale: 0.3, transformOrigin: "50% 30%" }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(3)" }, 9.3);
      tl.to("#pet-scale", { scaleX: 0.96, scaleY: 1.08, duration: 0.3, ease: "power2.out" }, 9.3);
      // the chomp
      tl.to("#coin", { scale: 0.2, opacity: 0, duration: 0.08, ease: "power2.in" }, 9.72);
      tl.to("#m-open", { opacity: 0, duration: 0.05 }, 9.78);
      tl.to("#m-smile", { opacity: 1, duration: 0.05 }, 9.78);
      tl.to("#pet-scale", { scaleX: 1.22, scaleY: 0.8, duration: 0.1, ease: "power2.out" }, 9.78);
      tl.to("#pet-scale", { scaleX: 1.16, scaleY: 1.08, duration: 0.8, ease: "elastic.out(1, 0.35)" }, 9.88);
      tl.set("#flash", { opacity: 0.85 }, 9.78);
      tl.to("#flash", { opacity: 0, duration: 0.35, ease: "power2.out" }, 9.8);
      tl.fromTo("#chomp-fx", { opacity: 0, scale: 0.2, rotation: -20 }, { opacity: 1, scale: 1, rotation: 6, duration: 0.3, ease: "back.out(2.8)" }, 9.8);
      tl.to("#chomp-fx", { scale: 1.08, duration: 0.18, yoyo: true, repeat: 3, ease: "sine.inOut" }, 10.12);
      tl.to("#chomp-fx", { opacity: 0, scale: 0.6, y: -40, duration: 0.3, ease: "power2.in" }, 10.9);
      // the world lights back up
      tl.to("#vignette", { opacity: 0, duration: 0.4 }, 9.8);
      tl.to("#dusk", { opacity: 0, duration: 0.6, ease: "power2.out" }, 9.8);
      tl.to("#ground", { backgroundColor: "#ddd2ff", duration: 0.6 }, 9.8);
      tl.to("#sun", { y: 0, opacity: 1, duration: 0.9, ease: "back.out(1.4)" }, 9.85);
      stars.forEach((s) => tl.to(s, { opacity: 0, duration: 0.3 }, 9.8));
      tl.to("#pet-svg", { filter: "saturate(1) brightness(1)", duration: 0.4, ease: "power2.out" }, 9.8);
      tl.to("#cheeks", { opacity: 1, duration: 0.3 }, 9.9);
      // meter refills, counter resets
      tl.to("#meter-fill", { opacity: 1, duration: 0.01 }, 9.8);
      tl.to("#meter-fill", { scaleX: 1, backgroundColor: "#7ee6a8", duration: 0.9, ease: "elastic.out(1, 0.5)" }, 9.85);
      tl.set("#d3", { opacity: 0 }, 9.85);
      tl.set("#d0b", { opacity: 1 }, 9.85);
      tl.fromTo("#d0b", { scale: 1.8 }, { scale: 1, duration: 0.4, ease: "back.out(2.5)" }, 9.85);
      tl.to("#blocks-panel", { opacity: 0, x: -80, duration: 0.4, ease: "power2.in" }, 11.2);
      // delighted
      tl.to("#eyes-open", { opacity: 0, duration: 0.08 }, 10.05);
      tl.to("#eyes-happy", { opacity: 1, duration: 0.08 }, 10.05);
      tl.to("#m-smile", { opacity: 0, duration: 0.08 }, 10.05);
      tl.to("#m-grin", { opacity: 1, duration: 0.08 }, 10.05);
      confetti.forEach((c, i) => {
        const t0 = 9.8 + (i % 6) * 0.015;
        tl.fromTo(c.el, { x: 0, y: 0, rotation: 0, opacity: 1 }, { x: c.dx, y: c.dy, rotation: c.rot, duration: 0.7, ease: "power3.out" }, t0);
        tl.to(c.el, { y: c.dy + c.fall, opacity: 0, duration: 1.1, ease: "power1.in" }, t0 + 0.7);
      });
      feedSparks.forEach((el, i) => {
        tl.fromTo(el, { scale: 0, opacity: 0, rotation: -60 }, { scale: 1.2, opacity: 1, rotation: 0, duration: 0.3, ease: "back.out(3)" }, 9.85 + i * 0.05);
        tl.to(el, { scale: 0, opacity: 0, duration: 0.4, ease: "power2.in" }, 10.6 + i * 0.05);
      });
      feedHearts.forEach((el, i) => {
        const t0 = 10.2 + i * 0.22;
        tl.fromTo(el, { opacity: 0, scale: 0.3, y: 0, x: 0 }, { opacity: 1, scale: 1, y: -80, x: i % 2 ? 16 : -16, duration: 0.45, ease: "back.out(2)" }, t0);
        tl.to(el, { opacity: 0, y: -240, x: i % 2 ? -10 : 10, duration: 1.0, ease: "power1.in" }, t0 + 0.55);
      });
      // happy hops on the beat
      [10.74, 11.76].forEach((t) => {
        tl.to("#pet-hop", { y: -80, duration: 0.24, ease: "power2.out" }, t);
        tl.to("#pet-hop", { y: 0, duration: 0.26, ease: "power2.in" }, t + 0.24);
        tl.to("#pet-shadow", { scale: 0.75, opacity: 0.6, duration: 0.24, yoyo: true, repeat: 1, ease: "power2.out" }, t);
      });

      // the pet leaps out of frame...
      tl.to("#pet-scale", { scaleX: 1.34, scaleY: 0.8, duration: 0.16, ease: "power2.out" }, 12.6);
      tl.to("#pet-scale", { scaleX: 0.92, scaleY: 1.26, duration: 0.16, ease: "power2.in" }, 12.78);
      tl.to("#pet-hop", { y: -1100, duration: 0.45, ease: "power2.in" }, 12.8);
      tl.to("#pet-shadow", { scale: 0, opacity: 0, duration: 0.35, ease: "power2.in" }, 12.8);

      // Beat 4 (13.0 - 18): end card; the pet lands on it
      tl.to("#hud-panel", { y: -200, duration: 0.35, ease: "power2.in" }, 12.95);
      tl.fromTo("#end-inner", { clipPath: "circle(0px at 960px 1180px)" }, { clipPath: "circle(1760px at 960px 1180px)", duration: 0.6, ease: "power2.inOut" }, 13.0);
      tl.fromTo("#end-pet", { y: -760 }, { y: 0, duration: 0.7, ease: "bounce.out" }, 13.25);
      tl.fromTo("#wordmark span", { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(2)", stagger: 0.045 }, 13.8);
      tl.fromTo("#ticker", { scale: 0, rotation: -8 }, { scale: 1, rotation: -3, duration: 0.5, ease: "back.out(2.6)" }, 14.35);
      tl.fromTo("#network", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 14.6);
      tl.to("#end-pet", { y: -14, duration: BEAT, ease: "sine.inOut", yoyo: true, repeat: 5 }, 14.3);
      tl.to("#ticker", { scale: 1.06, duration: BEAT, ease: "sine.inOut", yoyo: true, repeat: 3 }, 15.4);

      // captions: soft rise in
      ["#cap-1", "#cap-2", "#cap-3", "#cap-4", "#cap-5", "#cap-6"].forEach((id) => {
        const start = parseFloat(document.querySelector(id).dataset.start);
        tl.fromTo(id + " span", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, start);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
